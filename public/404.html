<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Padel Evolution</title>
  <script>
    // GitHub Pages SPA redirect fix
    var path = window.location.pathname;
    var repo = '/PadelEvolution';
    if (path.startsWith(repo)) {
      window.location.replace(repo + '/' + window.location.search + window.location.hash);
    } else {
      window.location.replace(repo + '/');
    }
  </script>
</head>
<body>
  <div style="font-family:sans-serif;text-align:center;padding:60px;background:#0B0F0A;color:#C8F135;min-height:100vh">
    <div style="font-size:48px;margin-bottom:20px">🎾</div>
    <div style="font-size:24px;font-weight:bold">Padel Evolution</div>
    <div style="color:#888;margin-top:10px">Reindirizzamento in corso...</div>
  </div>
</body>
</html>
